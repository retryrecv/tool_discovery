[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "planner"
version = "0.1.0"
description = "Planner runtime for complex user-query decomposition and state management"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=9.0"]

[tool.setuptools.packages.find]
where = ["src"]
